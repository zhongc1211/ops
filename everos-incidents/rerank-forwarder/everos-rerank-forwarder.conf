# EverOS rerank forwarder (Zack 2026-10-17 20:10 SGT: 「换，用转发的办法（不动 EverOS 代码）」).
# EverOS rerank provider "vllm" posts {model, query, documents} to <base_url>/rerank and reads results[].{index,relevance_score}.
# DashScope intl compatible-api/v1/reranks takes and returns exactly that shape, so this is a pure path rewrite: no body changes.
# Loopback only. Holds no key: EverOS sends its own Authorization (EVEROS_RERANK__API_KEY) and nginx passes it upstream.
# The access log format below has no headers, so the key never reaches a log.
log_format everos_rerank '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent rt=$request_time up=$upstream_status urt=$upstream_response_time';

server {
    listen 127.0.0.1:8031;
    server_name _;
    allow 127.0.0.1;
    deny all;

    access_log /var/log/nginx/everos-rerank.log everos_rerank;
    client_max_body_size 5m;

    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;

    location = /rerank {
        limit_except POST { deny all; }
        set $ds_rerank https://dashscope-intl.aliyuncs.com/compatible-api/v1/reranks;
        proxy_pass $ds_rerank;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name dashscope-intl.aliyuncs.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host dashscope-intl.aliyuncs.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
