# EverOS over the headscale tailnet only (Zack approved 2026-10-17 15:30 SGT).
# Clients: http://100.64.0.5/ (any Host; send Host: everos.deepvision.sg for clarity)
# Same bearer auth as the public path ($everos_authorized from /etc/nginx/everos-auth.conf).
#
# Boot safety: this "listen 100.64.0.5:80" shares port 80 with the wildcard
# "listen 80" in everos.conf, so nginx binds only *:80 and picks this server by
# the local address of each accepted connection. nginx therefore never binds
# 100.64.0.5 itself and starts fine before tailscaled brings tailscale0 up.
# Do NOT add "bind" to this listen.
# Only packets addressed to 100.64.0.5 (arriving on tailscale0) can reach this
# block; the allow/deny below is defence in depth.
server {
    listen 100.64.0.5:80;
    server_name _;

    allow 100.64.0.0/10;
    deny all;

    client_max_body_size 55m;
    proxy_read_timeout 400s;
    proxy_send_timeout 400s;

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        if ($everos_authorized = 0) {
            return 401;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Authorization "";
    }
}
